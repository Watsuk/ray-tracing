name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  devcontainer-ci:
    name: Build & Test (Dev Container)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run CI in Dev Container
        uses: devcontainers/ci@v0.3
        with:
          runCmd: |
            make build
            make test-verbose
